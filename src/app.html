<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon-blender.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Hunter Stevens is a software engineer building thoughtful web experiences with Svelte, TypeScript, and a human touch."
		/>
		<title>Hunter Stevens • Software Engineer</title>
		<script>
			try {
				if (localStorage.getItem('theme') === 'light')
					document.documentElement.classList.remove('dark');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
